name: Feature request
description: "Suggest an idea or an improvement."
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "What problem would it solve?"
      description: "What you were trying to do, and what got in the way."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "Your idea"
      description: "How it could work. Sketches and mock-ups are welcome."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Anything else you considered"
