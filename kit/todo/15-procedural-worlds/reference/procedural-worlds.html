<style>
/* Layout: the render fills the window; the app's own chrome floats over it (rail left, view title beside it, planet dock below). */
:root {
  color-scheme: dark;
  --space: #04060b;
  --paper: rgba(38, 45, 46, 0.86);
  --plate: #303839;
  --ink: #e9e7e1;
  --ink-2: #b8bcb7;
  --ink-3: #8e9692;
  --hair: #3a4445;
  --hair-2: #6f7a7a;
  --armour: #e3e1da;
  --on-armour: #161b1c;
  --orange: #e8873a;
  --on-orange: #161b1c;
  --green: #5fcf8e;
  --shadow-plate: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  --font-sans: "Archivo", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--space); color: var(--ink); font: 400 13px/18px var(--font-sans); overflow: hidden; }
.app { position: fixed; inset: 0; background: var(--space); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.label { position: absolute; left: 0; top: 0; font: 600 12.5px/1 var(--font-sans); color: var(--ink); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95); white-space: nowrap; will-change: transform; }
.hud { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; }
.bar { flex: none; padding-top: env(safe-area-inset-top, 0px); background: var(--paper); border-bottom: 1px solid var(--hair); pointer-events: auto; }
.bar-in { height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 22px; height: 22px; flex: none; color: var(--ink); }
.brand-name { font: 700 13px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.brand-sub { font: 400 12px/1 var(--font-mono); color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.views { display: flex; flex: none; border: 1px solid var(--hair-2); }
.seg { appearance: none; background: transparent; color: var(--ink-2); border: 0; border-left: 1px solid var(--hair); font: 600 12.5px/1 var(--font-sans); letter-spacing: 0.01em; height: 30px; padding: 0 14px; cursor: pointer; }
.seg:first-child { border-left: 0; }
.seg:hover { color: var(--ink); }
.seg[aria-pressed="true"] { background: var(--armour); color: var(--on-armour); }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 296px) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "rail title" "rail ." "dock dock"; gap: 16px 28px; padding-block: 16px calc(env(safe-area-inset-bottom, 0px) + 14px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail { grid-area: rail; align-self: start; max-height: 100%; overflow: auto; pointer-events: auto; min-width: 0; scrollbar-width: thin; }
.title { grid-area: title; align-self: start; min-width: 0; }
.eyebrow { display: flex; align-items: center; gap: 10px; font: 600 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; }
.tag { background: var(--orange); color: var(--on-orange); font: 500 12px/1 var(--font-mono); padding: 5px 6px; }
h1 { margin: 12px 0; font: 700 48px/0.9 var(--font-sans); letter-spacing: -0.015em; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6); }
.chip { display: inline-flex; border: 1px solid var(--ink-2); padding: 6px 9px; font: 600 12px/16px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; background: rgba(4, 6, 11, 0.45); }
.mod { background: var(--paper); border: 1px solid var(--hair); box-shadow: var(--shadow-plate); }
.mod-head { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--hair); }
.idx { font: 500 12px/1 var(--font-mono); color: var(--ink-3); }
.mod-title { flex: 1; min-width: 0; font: 700 12px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fold { appearance: none; width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.fold svg { width: 12px; height: 12px; transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1); }
.fold[aria-expanded="false"] svg { transform: rotate(180deg); }
.rows { margin: 0; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 8px 12px; border-bottom: 1px solid var(--hair); }
.row dt { font: 500 12px/16px var(--font-sans); color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.01em; white-space: nowrap; }
.row dd { margin: 0; min-width: 0; font: 600 13px/18px var(--font-sans); text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.row dd.mono { font: 500 12px/18px var(--font-mono); }
.swatch { display: inline-block; width: 9px; height: 9px; margin-right: 7px; vertical-align: 0; border-radius: 50%; }
.sub { padding: 10px 12px 6px; font: 500 12px/16px var(--font-sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.list { display: grid; padding: 0 0 4px; }
.item { appearance: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; text-align: left; padding: 7px 12px; border: 0; border-left: 2px solid transparent; background: transparent; color: var(--ink); cursor: pointer; }
.item:hover { background: rgba(255, 255, 255, 0.035); border-left-color: var(--orange); }
.item-name { font: 600 12.5px/15px var(--font-sans); }
.item-state { font: 400 12px/15px var(--font-mono); color: var(--ink-3); text-align: right; white-space: nowrap; }
.item-cls { grid-column: 1 / -1; font: 400 12px/15px var(--font-mono); color: var(--ink-3); }
.ctl { display: grid; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--hair); }
.ctl-label { display: flex; justify-content: space-between; gap: 12px; font: 500 12px/16px var(--font-sans); color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.01em; }
.ctl-label output { font: 500 12px/16px var(--font-mono); color: var(--ink); text-transform: none; }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--orange); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; flex: 1 1 auto; height: 32px; padding: 0 12px; border: 1px solid var(--hair-2); background: transparent; color: var(--ink); font: 600 12.5px/1 var(--font-sans); letter-spacing: 0.01em; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--armour); border-color: var(--armour); color: var(--on-armour); }
.note { margin: 0; padding: 10px 12px 12px; color: var(--ink-3); font: 400 12px/17px var(--font-sans); }
.dock-row { grid-area: dock; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; min-width: 0; }
.dock { display: flex; flex-wrap: wrap; align-items: stretch; gap: 4px; padding: 5px; background: var(--paper); border: 1px solid var(--hair); pointer-events: auto; min-width: 0; max-width: 100%; }
.dock-group { align-self: center; padding: 0 8px 0 6px; font: 500 12px/1 var(--font-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.dock-sep { width: 1px; margin: 4px 6px; background: var(--hair); }
.pick { appearance: none; display: grid; gap: 3px; min-width: 0; padding: 6px 10px; border: 1px solid transparent; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.pick:hover { background: rgba(255, 255, 255, 0.04); }
.pick[aria-pressed="true"] { border-color: var(--orange); background: rgba(232, 135, 58, 0.08); }
.pick-name { font: 600 13px/16px var(--font-sans); }
.pick-cls { font: 400 12px/15px var(--font-mono); color: var(--ink-3); white-space: nowrap; }
.foot { display: grid; justify-items: end; gap: 6px; font: 400 12px/15px var(--font-mono); color: var(--ink-3); text-align: right; }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
.dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--orange); }
.dot.ready { background: var(--green); }
.seg:focus-visible, .pick:focus-visible, .btn:focus-visible, .item:focus-visible, .fold:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; background: var(--space); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fallback p { max-width: 46ch; margin: 0; font: 500 14px/21px var(--font-sans); color: var(--ink-2); text-align: center; }
@media (max-width: 760px) {
  .brand-sub, .hint { display: none; }
  .seg { padding: 0 10px; }
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "title" "." "rail" "dock"; gap: 10px; padding-block: 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .rail { max-height: 36svh; }
  h1 { font-size: 34px; margin: 8px 0; }
  .dock-row { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
  .dock { flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .dock > * { flex: none; }
  .foot { justify-items: start; text-align: left; }
}

<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.31.0/babylon.js"></script>
<script>
// ---------------------------------------------------------------------------
// World generator: a port of sandbox-animations-v2 PR #31 (sidereal-v2
// world-generator.mjs) to the app's five world classes. Seeded 3D Perlin fbm
// sampled on the unit sphere (no seam, no pole pinch), domain warp, crater
// bands and storm vortices. Runs in workers and, for the first frame, inline.
// ---------------------------------------------------------------------------
function worldGenerator() {
  'use strict';
  const OUT = new Float64Array(9);
  const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const blend = (a, b, t) => { t = clamp(t); return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)]; };
  const scale = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const lift = (c, k) => [c[0] + k, c[1] + k, c[2] + k];
  const ramp = (c, t) => (t < 0.5 ? blend(c[0], c[1], t * 2) : blend(c[1], c[2], (t - 0.5) * 2));
  const byte = (x) => Math.round(clamp(x) * 255);
  const hex = (h) => { const v = parseInt(h.slice(1), 16); return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255]; };
  const lcg = (seed) => { let s = seed >>> 0; return () => ((s = (Math.imul(1664525, s) + 1013904223) >>> 0) / 4294967296); };
  const unitVector = (random, yMin, yMax) => {
    const y = yMin + random() * (yMax - yMin), angle = random() * Math.PI * 2, r = Math.sqrt(1 - y * y);
    return [r * Math.cos(angle), y, r * Math.sin(angle)];
  };

  // Rotation about a storm's axis curls nearby belts without a UV seam.
  function vortex(x, y, z, axis, tightness, turn) {
    const dot = x * axis[0] + y * axis[1] + z * axis[2];
    const angle = turn * Math.exp(-Math.max(0, 2 - 2 * dot) * tightness);
    const c = Math.cos(angle), s = Math.sin(angle), t = dot * (1 - c);
    return [x * c + (axis[1] * z - axis[2] * y) * s + axis[0] * t,
      y * c + (axis[2] * x - axis[0] * z) * s + axis[1] * t,
      z * c + (axis[0] * y - axis[1] * x) * s + axis[2] * t];
  }

  function craterBands(seed) {
    const random = lcg(seed);
    const craters = [{ axis: unitVector(random, -0.6, 0.6), radius: 0.2 + random() * 0.1 }];
    for (let i = 0; i < 164; i++) {
      const y = random() * 2 - 1, angle = random() * Math.PI * 2, r = Math.sqrt(1 - y * y);
      const radius = i < 44 ? 0.035 + random() ** 2 * 0.19 : 0.012 + random() ** 2 * 0.045;
      craters.push({ axis: [r * Math.cos(angle), y, r * Math.sin(angle)], radius });
    }
    const normalized = craters.map(({ axis, radius }) => {
      const length = Math.hypot(axis[0], axis[1], axis[2]);
      const distance2 = radius ** 2 * 3.24;
      return { axis: axis.map((value) => value / length), radius, distance2,
        reach: Math.sqrt(distance2) + 1e-12, strength: Math.min(1, radius * 12) };
    });
    return Array.from({ length: 64 }, (_, i) => normalized.filter((crater) =>
      crater.axis[1] + crater.reach >= i / 32 - 1 && crater.axis[1] - crater.reach <= (i + 1) / 32 - 1));
  }

  function noiseField(seed) {
    const table = Array.from({ length: 256 }, (_, i) => i);
    const random = lcg(seed);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      const swap = table[i]; table[i] = table[j]; table[j] = swap;
    }
    const p = Uint16Array.from(table.concat(table));
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const grad = (hash, x, y, z) => {
      const h = hash & 15, u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
      return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    };
    function noise(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
      const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return mix(
        mix(mix(grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z), u),
          mix(grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z), u), v),
        mix(mix(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u),
          mix(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    function fbm(x, y, z, octaves = 5) {
      let sum = 0, amplitude = 0.55;
      for (let i = 0; i < octaves; i++) {
        sum += noise(x, y, z) * amplitude;
        x = x * 2.03 + 11.7; y = y * 2.03 + 5.3; z = z * 2.03 + 8.9;
        amplitude *= 0.5;
      }
      return sum;
    }
    return { noise, fbm };
  }

  function createSampler(cls, seed, palette) {
    const { noise, fbm } = noiseField(seed);
    const P = palette.map(hex);
    const random = lcg((seed ^ 0x9e3779b9) >>> 0);
    const craters = cls === 'rocky' ? craterBands(seed) : null;
    const warp = cls !== 'rocky' && cls !== 'gas';
    const storms = cls === 'gas' ? [unitVector(random, -0.5, -0.15), unitVector(random, 0.12, 0.45)] : null;
    const bandFreq = 19 + random() * 8;
    const belts = blend(P[0], P[1], 0.45);
    const polarHaze = blend(P[0], P[1], 0.3);
    return (x, y, z) => {
      const broad = fbm(x * 2.8 + 4.1, y * 2.8 + 8.7, z * 2.8 - 2.4);
      const detail = fbm(x * 42 + 1.2, y * 42, z * 42, 4);
      let wx = x, wy = y, wz = z;
      if (warp) {
        wx = x + 0.24 * noise(x * 3 + 8, y * 3, z * 3);
        wy = y + 0.24 * noise(x * 3, y * 3 + 6, z * 3);
        wz = z + 0.24 * noise(x * 3, y * 3, z * 3 + 3);
      }
      let color, height = 0.5, er = 0, eg = 0, eb = 0, specular = 0, cloud = 0;

      if (cls === 'rocky') { // sidereal "morrow": banded crater field
        let relief = 0, ejecta = 0, floor = 0;
        for (const crater of craters[Math.min(63, Math.floor((y + 1) * 32))]) {
          const d2 = Math.max(0, 2 - 2 * (x * crater.axis[0] + y * crater.axis[1] + z * crater.axis[2]));
          if (d2 > crater.distance2) continue;
          const r = Math.sqrt(d2) / crater.radius;
          const bowl = Math.max(0, 1 - r * r);
          const rim = Math.exp(-(((r - 1) / 0.14) ** 2));
          relief += (rim * 0.22 - bowl * 0.30) * crater.strength;
          floor = Math.max(floor, (1 - smooth(0.65, 0.95, r)) * 0.48);
          ejecta = Math.max(ejecta, Math.exp(-(((r - 1.12) / 0.27) ** 2)) * (0.5 + detail));
        }
        const maria = smooth(-0.05, 0.22, fbm(x * 1.7 + 3.3, y * 1.7 - 1.1, z * 1.7 + 7.7, 4));
        const tone = clamp(0.56 + broad * 0.55 + detail * 0.22 - floor * 0.28 - maria * 0.32);
        color = blend(ramp(P, tone), scale(P[2], 1.08), ejecta * 0.45);
        height = 0.52 + broad * 0.12 + detail * 0.018 + relief - maria * 0.03;
      } else if (cls === 'gas') { // sidereal "zephra": vortex-curled belts
        const first = vortex(x, y, z, storms[0], 18, 4.8);
        const s = vortex(first[0], first[1], first[2], storms[1], 25, -3.2);
        const turbulence = fbm(s[0] * 12 + broad, s[1] * 17, s[2] * 12, 6);
        const belt = s[1] * 68 + turbulence * 3.4;
        const band = 0.5 + 0.5 * Math.sin(s[1] * bandFreq + turbulence * 1.7);
        color = blend(P[1], P[2], smooth(0.06, 0.94, band));
        const dark = smooth(0.66, 0.98, 0.5 + 0.5 * Math.sin(s[1] * 15 + broad * 1.4));
        color = blend(color, belts, dark * 0.7);
        const stream = 0.5 + 0.5 * Math.sin(belt + turbulence * 2);
        const filaments = 0.5 + 0.5 * Math.sin(belt * 3.7 + turbulence * 6);
        color = lift(scale(color, 0.78 + stream * 0.17 + filaments * 0.07), detail * 0.035);
        color = blend(color, polarHaze, smooth(0.74, 0.98, Math.abs(y)) * 0.55);
      } else if (cls === 'ice') { // sidereal "nivalis": fractured glacial plates
        const faults = Math.abs(fbm(wx * 6.7 + 3, wy * 6.7, wz * 6.7, 5));
        const crack = 1 - smooth(0.006, 0.07, faults);
        const margin = 1 - smooth(0.02, 0.16, faults);
        const oldIce = smooth(-0.12, 0.22, broad);
        color = blend(scale(P[2], 0.87), P[1], oldIce * 0.64);
        const dust = smooth(0.12, 0.28, fbm(x * 12, y * 12, z * 12, 4));
        color = blend(color, [0.48, 0.39, 0.28], dust * (1 - smooth(0.05, 0.14, faults)) * 0.35);
        color = blend(color, [0.56, 0.43, 0.34], margin * 0.38); // stained lineae margins

  const sun = BABYLON.MeshBuilder.CreateSphere('sun', { diameter: 2, segments: 96 }, scene);
  sun.parent = systemRoot; sun.scaling.setAll(sunDia / 2); sun.renderingGroupId = 1; sun.isPickable = false;
  const sunMat = shader('sun', SUN_FRAGMENT, [], { vertex: SUN_VERTEX, attributes: ['position', 'normal'], uniforms: ['world', 'worldViewProjection', 'cameraPosition', 'sunTint', 'time', 'detail', 'exposure'] });
  sunMat.setColor3('sunTint', sunTint); sunMat.setFloat('time', 0); sunMat.setFloat('detail', 0);
  sun.material = sunMat;
  function billboard(name, size, fragment, uniforms) {
    const plane = BABYLON.MeshBuilder.CreatePlane(name, { size }, scene);
    plane.parent = systemRoot; plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
    plane.renderingGroupId = 1; plane.isPickable = false; plane.alphaIndex = 10;
    const material = shader(name, fragment, [], { vertex: BILLBOARD_VERTEX, attributes: ['position', 'uv'], uniforms, alpha: true, add: true, doubleSided: true });
    material.setColor3('sunTint', sunTint);
    plane.material = material;
    return material;
  }
  const corona = billboard('corona', sunDia * 3.6, CORONA_FRAGMENT, ['worldViewProjection', 'sunTint', 'exposure', 'rs', 'time', 'strength']);
  corona.setFloat('rs', 0.5 / 1.8); corona.setFloat('time', 0); corona.setFloat('strength', 0.45);
  const glow = billboard('glow', sunDia * 10, GLOW_FRAGMENT, ['worldViewProjection', 'sunTint', 'strength']);
  glow.setFloat('strength', 0.24);

  const sunLight = new BABYLON.PointLight('sunLight', BABYLON.Vector3.Zero(), scene);
  sunLight.intensity = 1.6; sunLight.diffuse = sunTint; sunLight.specular = BABYLON.Color3.Black();
  const fill = new BABYLON.HemisphericLight('fill', new BABYLON.Vector3(0.3, 1, 0.2), scene);
  fill.intensity = 0.06;

  const orbitR = (i) => 11 + i * 6;
  const outer = orbitR(systemSpecs.length - 1);
  systemSpecs.forEach((spec, i) => {
    const pts = [];
    for (let k = 0; k <= 160; k++) { const a = (k / 160) * Math.PI * 2; pts.push(new BABYLON.Vector3(Math.cos(a) * orbitR(i), 0, Math.sin(a) * orbitR(i))); }
    const line = BABYLON.MeshBuilder.CreateLines('orbit' + i, { points: pts }, scene);
    line.color = BABYLON.Color3.FromHexString('#9fb0e0'); line.alpha = 0.16; line.isPickable = false;
    line.parent = systemRoot; line.renderingGroupId = 1;
  });
  const belt = (function createBelt() {
    const beltR = (orbitR(Math.floor(systemSpecs.length / 2) - 1) + orbitR(Math.floor(systemSpecs.length / 2))) / 2;
    const rock = BABYLON.MeshBuilder.CreateIcoSphere('rock', { radius: 1, subdivisions: 1, flat: true }, scene);
    rock.parent = systemRoot; rock.renderingGroupId = 1; rock.isPickable = false;
    const material = new BABYLON.StandardMaterial('rock', scene);
    material.diffuseColor = new BABYLON.Color3(0.4, 0.37, 0.34); material.specularColor = BABYLON.Color3.Black();
    rock.material = material;
    const count = 340, buffer = new Float32Array(count * 16), rand = mulberry32(fnv1a(ORION.id + ':belt')), m = new BABYLON.Matrix();
    for (let i = 0; i < count; i++) {
      const a = rand() * Math.PI * 2, r = beltR + (rand() - 0.5) * 3.4, s = 0.05 + Math.pow(rand(), 2) * 0.16;
      BABYLON.Matrix.ComposeToRef(new BABYLON.Vector3(s, s * (0.65 + rand() * 0.35), s * (0.8 + rand() * 0.2)),
        BABYLON.Quaternion.RotationYawPitchRoll(rand() * 6.28, rand() * 6.28, rand() * 6.28),
        new BABYLON.Vector3(Math.cos(a) * r, (rand() - 0.5) * 0.5, Math.sin(a) * r), m);
      m.copyToArray(buffer, i * 16);
    }
    rock.thinInstanceSetBuffer('matrix', buffer, 16, true);
    return rock;
  })();

  const systemWorlds = systemSpecs.map((spec, i) => {
    const rand = mulberry32(fnv1a(spec.projectId + ':' + spec.name));
    const a0 = rand() * Math.PI * 2;
    const world = createWorld(spec, { name: 'sys-' + spec.name, parent: systemRoot, radius: spec.dia / 2, segments: 48,
      tilt: (rand() - 0.5) * 0.5, spin: 0.08 + rand() * 0.14 });
    world.orbit = { r: orbitR(i), a: a0, speed: 0.9 * Math.pow(orbitR(i), -1.5) };
    world.setSun(BABYLON.Vector3.Zero());
    return world;
  });

  // ---------------------------------------------------------------------------
  // Planet view: scene/planet/view.js framing (diameter 12, camera 1.9×, tilt
  // 0.35, key light from (0.55, -0.35, 0.75)) with 1–2 seeded moons.
  // ---------------------------------------------------------------------------
  const PDIA = 12;
  const planetRoot = new BABYLON.TransformNode('planet-view', scene);
  planetRoot.setEnabled(false);
  const KEY_DIR = new BABYLON.Vector3(-0.55, 0.35, -0.75).normalize();
  const planetView = { spec: null, world: null, moons: [], sunAngle: 0, sunPosition: new BABYLON.Vector3(), started: 0 };
  function placeSun() {
    const t = (planetView.sunAngle * Math.PI) / 180, c = Math.cos(t), s = Math.sin(t);
    planetView.sunPosition.set((KEY_DIR.x * c + KEY_DIR.z * s) * 1e5, KEY_DIR.y * 1e5, (-KEY_DIR.x * s + KEY_DIR.z * c) * 1e5);
    if (planetView.world) planetView.world.setSun(planetView.sunPosition);
    for (const moon of planetView.moons) moon.world.setSun(planetView.sunPosition);
  }
  function buildPlanetView(spec) {
    if (planetView.world) planetView.world.dispose();
    for (const moon of planetView.moons) moon.world.dispose();
    planetView.moons = [];
    planetView.spec = spec;
    planetView.world = createWorld(spec, { name: 'pv-' + spec.key, parent: planetRoot, radius: PDIA / 2, segments: 128, tilt: 0.35, spin: 0.02 });
    const rand = mulberry32(fnv1a(spec.projectId + ':moons:' + spec.name));
    const count = 1 + Math.floor(rand() * 2);
    for (let i = 0; i < count; i++) {
      const md = 0.8 + rand() * 1.1;
      const mspec = moonSpec(spec, i);
      const world = createWorld(mspec, { name: 'moon-' + spec.key + i, parent: planetRoot, radius: md / 2, segments: 48, tilt: 0.1, spin: 0.05 });
      planetView.moons.push({ world, r: PDIA * (0.9 + rand() * 0.5), a: rand() * 6.28,
        speed: (0.006 + rand() * 0.006) * (rand() > 0.5 ? 1 : -1), tilt: (rand() - 0.5) * 0.8, yoff: (rand() - 0.5) * PDIA * 0.4 });
      ensureMaps(mspec, 512, 1).then((maps) => { if (planetView.spec === spec) world.setMaps(maps); }).catch(() => {});
    }
    placeSun();
    const detailKey = mapKey(spec, 2048);
    if (ready.has(detailKey)) { planetView.world.setMaps(ready.get(detailKey)); setStatus(spec.name + ': ' + mapSize(ready.get(detailKey)) + ' map from the cache', true); renderPanel(); return; }
    planetView.started = performance.now();
    setStatus(pool.size ? 'Generating the 2048 × 1024 map for ' + spec.name + ' in a worker…' : 'Generating the 1024 × 512 map for ' + spec.name + ' on the main thread…', false);
    renderPanel();
    if (!ready.has(mapKey(spec, 512))) {
      ensureMaps(spec, 512, 4).then((maps) => {
        if (planetView.spec === spec && planetView.world.mapsKey !== detailKey) planetView.world.setMaps(maps);
      }).catch(() => {});
    }
    ensureMaps(spec, 2048, 3).then((maps) => {
      if (planetView.spec !== spec) return;
      planetView.world.setMaps(maps);
      const seconds = ((performance.now() - planetView.started) / 1000).toFixed(2);
      setStatus(spec.name + ': ' + mapSize(maps) + ' map swapped in after ' + seconds + ' s', true);
      document.body.dataset.detail = spec.key;
      renderPanel();
    }).catch(() => { if (planetView.spec === spec) { setStatus('The detail map could not be generated; showing the system map.', false); renderPanel(); } });
  }

  // ---------------------------------------------------------------------------
  // Views, camera framings, labels and picking.
  // ---------------------------------------------------------------------------
  let view = 'system';
  function frame(cfg) {
    camera.lowerRadiusLimit = null; camera.upperRadiusLimit = null;
    camera.setTarget(BABYLON.Vector3.Zero());
    camera.alpha = -Math.PI / 2; camera.beta = cfg.beta; camera.radius = cfg.radius;
    camera.lowerBetaLimit = cfg.lowerBeta; camera.upperBetaLimit = cfg.upperBeta;
    camera.lowerRadiusLimit = cfg.lower; camera.upperRadiusLimit = cfg.upper;
    camera.inertialAlphaOffset = camera.inertialBetaOffset = camera.inertialRadiusOffset = 0;
  }
  function setView(next, spec) {
    view = next;
    systemRoot.setEnabled(next !== 'planet');
    planetRoot.setEnabled(next === 'planet');
    for (const [id, name] of [['view-system', 'system'], ['view-planet', 'planet'], ['view-sun', 'sun']]) $(id).setAttribute('aria-pressed', String(view === name));
    if (next === 'system') {
      frame({ beta: 0.92, radius: outer * 2.3 + 14, lower: 18, upper: outer * 3.4 + 40, lowerBeta: 0.15, upperBeta: 1.45 });
      setStatus(systemStatus(), allSystemReady());
    } else if (next === 'sun') {
      frame({ beta: 1.05, radius: sunDia * 2.1, lower: sunDia * 0.85, upper: outer * 3.4 + 40, lowerBeta: 0.15, upperBeta: 2.9 });
      setStatus('Star shader runs live; nothing to generate', true);
    } else {
      const target = spec || planetView.spec || systemSpecs[0];
      const ringed = target.rings;
      frame({ beta: 1.24, radius: PDIA * (ringed ? 2.9 : 1.9), lower: PDIA * (ringed ? 1.35 : 1.15), upper: PDIA * (ringed ? 5 : 4), lowerBeta: 0.2, upperBeta: 1.55 });
      if (target !== planetView.spec) buildPlanetView(target);
    }
    for (const label of labels) label.el.hidden = view !== 'system';
    $('hint').textContent = view === 'system' ? 'Drag to orbit · scroll to zoom · click a planet' : 'Drag to orbit · scroll to zoom';
    renderTitle(); renderPanel(); renderDock();
  }

  const labelLayer = $('labels');
  const PERSISTENT = systemSpecs.slice().sort((a, b) => b.dia - a.dia).slice(0, 3).map((s) => s.name);
  const labels = systemWorlds.map((world) => {
    const el = document.createElement('div');
    el.className = 'label'; el.textContent = world.spec.name;
    labelLayer.appendChild(el);
    return { el, world, persistent: PERSISTENT.indexOf(world.spec.name) >= 0 };
  });
  let hovered = null;
  const projected = new BABYLON.Vector3();
  function placeLabels() {
    if (view !== 'system') return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const viewport = camera.viewport.toGlobal(w, h), transform = scene.getTransformMatrix();
    const pxPerUnit = h / (2 * Math.tan(camera.fov / 2));
    for (const label of labels) {
      const pos = label.world.root.getAbsolutePosition();
      BABYLON.Vector3.ProjectToRef(pos, BABYLON.Matrix.IdentityReadOnly, transform, viewport, projected);
      const visible = (label.persistent || hovered === label.world) && projected.z > 0 && projected.z < 1;
      label.el.style.opacity = visible ? '0.95' : '0';
      if (!visible) continue;
      const dist = BABYLON.Vector3.Distance(camera.position, pos);
      const radiusPx = (label.world.spec.dia / 2 / dist) * pxPerUnit;
      label.el.style.transform = 'translate(' + projected.x.toFixed(1) + 'px,' + (projected.y - radiusPx - 8).toFixed(1) + 'px) translate(-50%, -100%)';
    }
  }
  scene.onPointerObservable.add((info) => {
    if (view !== 'system') { hovered = null; return; }
    if (info.type === BABYLON.PointerEventTypes.POINTERMOVE) {
      const hit = scene.pick(scene.pointerX, scene.pointerY, (mesh) => Boolean(mesh.metadata && mesh.metadata.spec) && mesh.isEnabled());
      const world = hit && hit.hit ? systemWorlds.find((w) => w.globe === hit.pickedMesh) : null;
      hovered = world || null;
      canvas.style.cursor = hovered ? 'pointer' : 'default';
    } else if (info.type === BABYLON.PointerEventTypes.POINTERTAP) {
      const hit = scene.pick(scene.pointerX, scene.pointerY, (mesh) => Boolean(mesh.metadata && mesh.metadata.spec) && mesh.isEnabled());
      const world = hit && hit.hit ? systemWorlds.find((w) => w.globe === hit.pickedMesh) : null;
      if (world) { canvas.style.cursor = 'default'; setView('planet', world.spec); }
    }
  });

  // ---------------------------------------------------------------------------
  // HUD
  // ---------------------------------------------------------------------------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const row = (label, value, mono) => '<div class="row"><dt>' + esc(label) + '</dt><dd' + (mono ? ' class="mono"' : '') + '>' + value + '</dd></div>';
  const swatch = (hex) => '<span class="swatch" style="background:' + hex + '"></span>';
  const seedHex = (seed) => (seed >>> 0).toString(16).toUpperCase().padStart(8, '0');
  const fmtMs = (ms) => (ms >= 1000 ? (ms / 1000).toFixed(2) + ' s' : Math.round(ms) + ' ms');
  let sceneReady = false;
  const allSystemReady = () => sceneReady && systemSpecs.every((spec) => ready.has(mapKey(spec, 512)));
  function systemStatus() {
    if (!sceneReady) return 'Compiling shaders…';
    const done = systemSpecs.filter((spec) => ready.has(mapKey(spec, 512))).length;
    return done === systemSpecs.length ? 'All five 512 × 256 maps ready · ' + (pool.size ? pool.size + ' workers' : 'main thread') : 'Generating 512 × 256 maps · ' + done + ' of ' + systemSpecs.length;
  }
  function setStatus(text, ok) { $('status').textContent = text; $('status-dot').classList.toggle('ready', Boolean(ok)); }
  function layers(spec) {
    const parts = ['Albedo + height', 'emission + water mask'];
    if (spec.clouds) parts.push('clouds');
    if (spec.rings) parts.push('rings');
    return parts.join(', ');
  }
  function mapState(spec, width) {
    const key = mapKey(spec, width);
    if (ready.has(key)) return width + ' × ' + width / 2 + ' · ' + fmtMs(timings.get(key) || 0);
    return pending.has(key) ? 'generating…' : 'queued';
  }
  function renderTitle() {
    if (view === 'system') {
      $('eyebrow').textContent = 'System · preview'; $('headline').textContent = ORION.name;
      $('subline').textContent = systemSpecs.length + ' planets · generated maps';
    } else if (view === 'sun') {
      $('eyebrow').textContent = 'Star · preview'; $('headline').textContent = ORION.name + ' star';
      $('subline').textContent = SUN_NAMES[sunHex] + ' · diameter ' + sunDia.toFixed(1);
    } else {
      const spec = planetView.spec;
      $('eyebrow').textContent = 'Planet · preview'; $('headline').textContent = spec.name;
      $('subline').textContent = spec.label + ' · ' + spec.project + (spec.variant ? ' · seed variant ' + spec.variant : '');
    }
  }
  const FOOTNOTE = '<p class="note">A browser preview of kit 15, driven by the app’s own seeds, palettes and layout for the synthetic universe the screenshot gates use. Ships, the other panels and the skybox photo are left out.</p>';
  function renderPanel() {
    const body = $('mod-body');
    if (view === 'system') {
      $('mod-idx').textContent = '01'; $('mod-title').textContent = 'Project: ' + ORION.name;
      let html = '<dl class="rows">' +
        row('Star', swatch(sunHex) + esc(SUN_NAMES[sunHex])) +
        row('Planets', String(systemSpecs.length)) +
        row('Surface maps', '512 × 256 each') +
        row('Seeds', 'project + folder name') + '</dl>';
      html += '<div class="sub">Planets</div><div class="list">';
      for (const spec of systemSpecs) {
        html += '<button class="item" type="button" data-open="' + esc(spec.key) + '"><span class="item-name">' + esc(spec.name) + '</span>' +
          '<span class="item-state">' + esc(mapState(spec, 512)) + '</span><span class="item-cls">' + esc(spec.label + ' · ' + spec.atmo.label + (spec.rings ? ' · rings' : '')) + '</span></button>';
      }
      html += '</div><p class="note">Each map is seeded 3D noise sampled on the sphere, so there is no repeat, no seam and no pinch at the poles. Today these planets use a 1024 px photo tiled twice around the sphere.</p>' + FOOTNOTE;
      body.innerHTML = html;
    } else if (view === 'sun') {
      $('mod-idx').textContent = '03'; $('mod-title').textContent = 'Star: ' + ORION.name;
      body.innerHTML = '<dl class="rows">' +
        row('Colour', swatch(sunHex) + esc(SUN_NAMES[sunHex] + ', ' + sunHex)) +
        row('Diameter', sunDia.toFixed(1) + ' units') +
        row('Surface', 'Live granulation, spots') +
        row('Limb', 'Quadratic, 0.47 / 0.23') +
        row('Tone mapping', 'ACES, exposure 1.0') +
        row('Corona', 'Additive billboard') +
        row('Glow layer', 'None') + '</dl>' +
        '<p class="note">Today the star is a flat emissive sphere under a glow layer, and its core clips to white. Here the tone curve keeps the core’s colour, and the limb darkens and reddens the way a photosphere does.</p>' + FOOTNOTE;
    } else {
      const spec = planetView.spec;
      $('mod-idx').textContent = '02'; $('mod-title').textContent = 'Planet: ' + spec.name;
      const key = mapKey(spec, 2048);
      const generated = ready.has(key) ? fmtMs(timings.get(key) || 0) + (pool.size ? ' in a worker' : ' on the main thread') : 'in progress…';
      const angle = planetView.sunAngle;
      body.innerHTML = '<dl class="rows">' +
        row('Project', esc(spec.project)) +
        row('Class', esc(spec.label + (spec.rings ? ', ringed' : ''))) +
        row('Seed', seedHex(spec.seed), true) +
        row('Atmosphere', swatch(spec.atmo.color) + esc(spec.atmo.label)) +
        row('Surface map', ready.has(key) ? mapSize(ready.get(key)) : (pool.size ? '2048 × 1024' : '1024 × 512')) +
        row('Layers', esc(layers(spec))) +
        row('Generated', esc(generated)) + '</dl>' +
        '<div class="ctl"><label class="ctl-label" for="sun-angle">Sun angle <output id="sun-angle-value" for="sun-angle">' + (angle === 0 ? 'app light' : (angle > 0 ? '+' : '') + angle + '°') + '</output></label>' +
        '<input id="sun-angle" type="range" min="-180" max="180" step="5" value="' + angle + '"></div>' +
        '<div class="ctl"><div class="btns"><button class="btn" id="reseed" type="button">Try another seed</button><button class="btn primary" id="back" type="button">Back to system</button></div></div>' +
        '<p class="note">The view opens on the 512 × 256 system map and swaps to the 2048 × 1024 map when the worker finishes (decision D3). Turn the sun to see the night side.</p>' + FOOTNOTE;
      $('sun-angle').addEventListener('input', (event) => {
        planetView.sunAngle = Number(event.target.value);
        $('sun-angle-value').textContent = planetView.sunAngle === 0 ? 'app light' : (planetView.sunAngle > 0 ? '+' : '') + planetView.sunAngle + '°';
        placeSun();
      });
      $('reseed').addEventListener('click', () => {
        const next = planetSpec(spec.projectId, spec.project, spec.pd, spec.variant + 1);
        buildPlanetView(next); setView('planet', next);
      });
      $('back').addEventListener('click', () => setView('system'));
    }
  }
  $('mod-body').addEventListener('click', (event) => {
    const button = event.target.closest('[data-open]');
    if (!button) return;
    const spec = pickable.find((s) => s.key === button.getAttribute('data-open'));
    if (spec) setView('planet', spec);
  });
  function renderDock() {
    const dock = $('dock');
    const current = view === 'planet' && planetView.spec ? planetView.spec.projectId + ':' + planetView.spec.name : null;
    const chip = (spec, i, extra) => '<button class="pick" id="pick-' + i + '" type="button" data-pick="' + i + '" aria-pressed="' + String(current === spec.projectId + ':' + spec.name) + '">' +
      '<span class="pick-name">' + esc(spec.name) + '</span><span class="pick-cls">' + esc(spec.label + (extra ? ' · ' + extra : '')) + '</span></button>';
    let html = '<span class="dock-group">' + esc(ORION.name) + '</span>';
    systemSpecs.forEach((spec, i) => { html += chip(spec, i, spec.rings ? 'rings' : ''); });
    html += '<span class="dock-sep" aria-hidden="true"></span><span class="dock-group">Other systems</span>';
    guestSpecs.forEach((spec, j) => { html += chip(spec, systemSpecs.length + j, spec.project); });
    dock.innerHTML = html;
  }
  $('dock').addEventListener('click', (event) => {
    const button = event.target.closest('[data-pick]');
    if (!button) return;
    const base = pickable[Number(button.getAttribute('data-pick'))];
    setView('planet', base);
  });
  $('view-system').addEventListener('click', () => setView('system'));
  $('view-planet').addEventListener('click', () => setView('planet'));
  $('view-sun').addEventListener('click', () => setView('sun'));
  $('fold').addEventListener('click', () => {
    const open = $('fold').getAttribute('aria-expanded') !== 'true';
    $('fold').setAttribute('aria-expanded', String(open));
    $('mod-body').hidden = !open;
  });
  if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) { $('fold').setAttribute('aria-expanded', 'false'); $('mod-body').hidden = true; }

  // ---------------------------------------------------------------------------
  // Start: placeholders render at once, the five system maps follow from the pool.
  // ---------------------------------------------------------------------------
  setView('system');
  systemSpecs.forEach((spec, i) => {
    ensureMaps(spec, 512, 2 - i * 0.1).then((maps) => {
      systemWorlds[i].setMaps(maps);
      if (view === 'system') { setStatus(systemStatus(), allSystemReady()); renderPanel(); }
      if (allSystemReady()) document.body.dataset.system = 'ready';
    }).catch(() => setStatus('A system map could not be generated; showing the placeholder.', false));
  });

  const bootStarted = performance.now();
  scene.executeWhenReady(() => {
    sceneReady = true;
    document.body.dataset.scene = String(Math.round(performance.now() - bootStarted));
    if (allSystemReady()) document.body.dataset.system = 'ready';
    if (view === 'system') { setStatus(systemStatus(), allSystemReady()); renderPanel(); }
  });

  let time = 0;
  scene.onBeforeRenderObservable.add(() => {
    const dt = still ? 0 : Math.min(0.05, engine.getDeltaTime() / 1000);
    time += dt;
    const eye = camera.globalPosition;
    if (view !== 'planet') {
      for (const world of systemWorlds) {
        world.orbit.a += world.orbit.speed * dt;
        world.root.position.set(Math.cos(world.orbit.a) * world.orbit.r, 0, Math.sin(world.orbit.a) * world.orbit.r);
        world.update(dt, eye);
      }
      belt.rotation.y += dt * 0.004;
      sun.rotation.y += dt * 0.01;
      sunMat.setVector3('cameraPosition', eye);
      sunMat.setFloat('time', time);
      corona.setFloat('time', time);
      const dist = BABYLON.Vector3.Distance(eye, sun.getAbsolutePosition());
      const px = (sunDia / dist) / Math.tan(camera.fov / 2) * (engine.getRenderHeight() / 2);
      sunMat.setFloat('detail', clamp((px - 60) / 360, 0, 1));
    } else if (planetView.world) {
      planetView.world.update(dt, eye);
      for (const moon of planetView.moons) {
        moon.a += moon.speed * dt;
        moon.world.root.position.set(Math.cos(moon.a) * moon.r, moon.yoff + Math.sin(moon.a) * moon.r * moon.tilt, Math.sin(moon.a) * moon.r);
        moon.world.update(dt, eye);
      }
    }
  });
  scene.onAfterRenderObservable.add(placeLabels);
  engine.runRenderLoop(() => scene.render());
  // Portrait screens keep the landscape framing across their width instead of cropping the orbits.
  const fitAspect = () => {
    camera.fovMode = engine.getRenderWidth() < engine.getRenderHeight() ? BABYLON.Camera.FOVMODE_HORIZONTAL_FIXED : BABYLON.Camera.FOVMODE_VERTICAL_FIXED;
  };
  fitAspect();
  window.addEventListener('resize', () => { engine.resize(); fitAspect(); });
})();
</script>
